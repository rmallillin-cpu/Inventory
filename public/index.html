<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0616">
<title>Thea — Inventory</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> THEA</div>
  <div class="topbar-actions">
    <a href="/admin.html" class="btn btn-ghost btn-sm">Admin</a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>Every era.<br><span class="accent">One inventory.</span></h1>
    <p>Albums, photocards, lightsticks & apparel — search by name, group, or scan the tag on a physical item to pull it up instantly.</p>

    <div class="searchbar">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Search item, group, or SKU...">
      <button class="icon-btn" id="scanBtn" title="Scan QR code">📷</button>
    </div>

    <div class="chips" id="categoryChips"></div>
  </div>

  <div class="toolbar">
    <span class="dim" id="resultCount"></span>
    <span style="flex:1"></span>
    <label class="toggle"><input type="checkbox" id="inStockOnly"> In stock only</label>
    <select id="sortSelect" aria-label="Sort items">
      <option value="new">Newest</option>
      <option value="plow">Price: low to high</option>
      <option value="phigh">Price: high to low</option>
      <option value="az">Name: A–Z</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</div>

<button class="cart-fab" id="cartFab">
  🛍️
  <span class="cart-count" id="cartCount" style="display:none">0</span>
</button>

<!-- Item detail modal -->
<div class="overlay" id="itemOverlay" style="display:none">
  <div class="modal" id="itemModal"></div>
</div>

<!-- Cart modal -->
<div class="overlay" id="cartOverlay" style="display:none">
  <div class="modal" id="cartModal"></div>
</div>

<!-- QR Scanner modal -->
<div class="overlay" id="scanOverlay" style="display:none">
  <div class="modal" style="max-width:420px">
    <button class="modal-close" onclick="closeScanner()">×</button>
    <div style="padding:20px">
      <h3 style="font-family:var(--font-display);margin-top:0">Scan item QR code</h3>
      <div id="qr-reader" style="width:100%;border-radius:12px;overflow:hidden"></div>
      <p class="dim" style="font-size:13px;margin-top:10px">Point your camera at the QR tag on the item's packaging or shelf label.</p>
    </div>
  </div>
</div>

<div id="toastHost"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/storefront.js"></script>
</body>
</html>
