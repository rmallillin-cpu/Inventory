services:
  - type: web
    name: kpop-inventory
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LOW_STOCK_THRESHOLD
        value: "5"
      - key: GOOGLE_SHEET_ID
        value: 1Mx8M1NdwLDYzLE7tGkt05SxuXADPY82vzI1zsz0OUfs
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1Xly2tafbPVFauPqrkd_iEpaXzGcsNFQb
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
